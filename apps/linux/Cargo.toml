[package]
name = "raptor-gtk"
description = "Raptor for Linux: a GTK 4 / libadwaita client for Rex servers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "raptor"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
raptor-core = { path = "../../crates/raptor-core" }
async-channel = "2"
tracing = "0.1"
pangocairo = "0.22"
pango = { version = "0.22", features = ["v1_56"] }
unicode-segmentation = "1"
serde_json = "1"

[dev-dependencies]
raptor-term = { path = "../../crates/raptor-term" }
