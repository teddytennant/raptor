name: Shrew
options:
  bundleIdPrefix: dev.shrew
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ShrewKit:
    path: ShrewKit
targets:
  Shrew:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: dev.shrew.app
            CFBundleURLSchemes: [shrew]
    dependencies:
      - package: ShrewKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shrew.app
        PRODUCT_NAME: Shrew
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shrew
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Shrew connects to Rex servers on your network and tailnet."
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        # Rex servers on a tailnet speak plain HTTP on 100.x addresses (WireGuard encrypts them).
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  ShrewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Shrew
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shrew.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
schemes:
  Shrew:
    build:
      targets:
        Shrew: all
        ShrewUITests: [test]
    test:
      targets:
        - ShrewUITests
