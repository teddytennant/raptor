[workspace]
resolver = "3"
members = ["crates/*", "apps/linux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/teddytennant/raptor"
rust-version = "1.90"

[workspace.dependencies]
raptor-proto = { path = "crates/raptor-proto" }
raptor-client = { path = "crates/raptor-client" }
raptor-term = { path = "crates/raptor-term" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
