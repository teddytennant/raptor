[workspace]
resolver = "3"
members = ["crates/*", "apps/linux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/teddytennant/shrew"
rust-version = "1.90"

[workspace.dependencies]
shrew-proto = { path = "crates/shrew-proto" }
shrew-client = { path = "crates/shrew-client" }
shrew-term = { path = "crates/shrew-term" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
