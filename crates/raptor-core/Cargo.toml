[package]
name = "raptor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = "0.3.34"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
raptor-client = { version = "0.1.0", path = "../raptor-client" }
raptor-proto = { version = "0.1.0", path = "../raptor-proto" }
raptor-term = { version = "0.1.0", path = "../raptor-term" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
