[package]
name = "shrew-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = "0.3.34"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shrew-client = { version = "0.1.0", path = "../shrew-client" }
shrew-proto = { version = "0.1.0", path = "../shrew-proto" }
shrew-term = { version = "0.1.0", path = "../shrew-term" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
